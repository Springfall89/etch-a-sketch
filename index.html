<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch A Sketch</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="icon" href="imgs/favicon.png">
    <script defer src="js/index.js"></script>
</head>
<body>
    <div class="etch-a-sketch">
        <div class="title">
            <div class="title-text">
                <p class="title-sub">MAGIC</p>
                <p class="title-main">Etch A Sketch</p>
                <p class="title-sub">SCREEN</p>
            </div>
            <a class="src-text" href="https://github.com/Springfall89/etch-a-sketch" target="_blank" rel="noopener">Source Code</a>
        </div>
        <div class="grid"></div>
        <p class="focus-out-text">Click on the screen to draw!</p>
        <div class="bottom">
            <button class="knob" id="knob-resize">Resize</button>
            <div class="bottom-middle">
                <div class="mode-select">
                    <p class="mode-label">Mode: </p>
                    <select class="mode-options" name="modes" id="mode-options">
                        <option value="normal">Normal</option>
                        <option value="darken">Darken</option>
                        <option value="rgb">RGB</option>
                        <option value="erase">Erase</option>
                    </select>
                </div>
                <div class="hover-flag">
                    <input class="hover-checkbox" id="hover-checkbox" type="checkbox" name="hover-flag" value="hover">
                        <p class="hover-text">Hover</p>
                </div>
            </div>
            <button class="knob" id="knob-reset">Reset</button>
        </div>
    </div>
</body>
</html>
