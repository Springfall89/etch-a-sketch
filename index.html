<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch A Sketch</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="icon" href="./imgs/favicon.png">
    <script defer src="./js/global.js"></script>
    <script defer src="./js/index.js"></script>
</head>
<body>
    <div class="etch-a-sketch">
        <div class="grid-box-container"></div>
        <div class="bottom">
            <button class="knob" id="knob-resize">
                <p>Resize</p>
            </button>

            <div class="logo">
                <p class="logo-sub-text">MAGIC</p>
                <div class="logo-main">
                    <p class="logo-main-text">Etch A Sketch</p>
                    <div class="logo-main-bottom">
                        <a class="src-text" href="https://github.com/Springfall89/etch-a-sketch" target="_blank" rel="noopener">Source Code</a>
                        <div class="mode-form">
                            <label for="mode-select">Mode:</label>
                            <select name="mode" id="mode-select">
                                <option value="normal">Normal</option>
                                <option value="darken">Darken</option>
                                <option value="rgb">RGB</option>
                            </select>
                        </div>
                    </div>
                </div>
                <p class="logo-sub-text">SCREEN</p>
            </div>

            <button class="knob" id="knob-reset">
                <p>Reset</p>
            </button>
        </div>
    </div>
</body>
</html>
