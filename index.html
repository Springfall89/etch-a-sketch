<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch A Sketch</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="icon" href="imgs/favicon.png">
    <script defer src="js/index.js"></script>
</head>
<body>
    <div class="etch-a-sketch">
        <div class="title">
            <div class="title-text">
                <p class="title-sub">MAGIC</p>
                <p class="title-main">Etch A Sketch</p>
                <p class="title-sub">SCREEN</p>
            </div>
            <a class="src-text" href="https://github.com/Springfall89/etch-a-sketch" target="_blank" rel="noopener">Source Code</a>
        </div>
        <div class="grid"></div>
        <div class="bottom">
            <button class="knob" id="knob-resize">Resize</button>
            <div class="mode-select">
                <label class="mode-label" for="mode-options">Mode: </label>
                <select class="mode-options" name="modes" id="mode-options">
                    <option value="Normal">Normal</option>
                    <option value="Darken">Darken</option>
                    <option value="RGB">RGB</option>
                </select>
            </div>
            <button class="knob" id="knob-reset">Reset</button>
        </div>
    </div>
</body>
</html>
